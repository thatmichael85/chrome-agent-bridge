<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chrome Agent Bridge — Monitor</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #263449;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-bg: rgba(56, 189, 248, 0.14);
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      width: 420px;
      min-height: 480px;
      max-height: 580px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13.5px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .status-dot.offline {
      background: var(--red);
      box-shadow: none;
    }
    .btn {
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.25);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      color: var(--text);
      background: var(--surface-hover);
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 8px;
      text-align: center;
    }
    .kpi-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .kpi-lbl {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }
    .section {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      color: var(--text);
      cursor: pointer;
    }
    .chip:hover {
      border-color: var(--accent);
    }
    .chip-count {
      color: var(--accent);
      font-weight: 600;
    }
    .feed-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 4px;
    }
    .tabs-toggle {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
    }
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 6px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      padding: 1.5px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-visit {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }
    .badge-cmd {
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
    }
    .badge-err {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
    }
    .domain-name {
      font-weight: 600;
      color: var(--text);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .time {
      color: var(--muted);
      font-size: 10.5px;
      white-space: nowrap;
    }
    .url-line {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .meta-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--muted);
    }
    .session-tag {
      color: #cbd5e1;
      background: rgba(148, 163, 184, 0.14);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .focus-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 10.5px;
      cursor: pointer;
      padding: 0;
      font-weight: 600;
    }
    .focus-link:hover {
      text-decoration: underline;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span id="statusDot" class="status-dot"></span>
      <span>Chrome Agent Bridge</span>
    </div>
    <div style="display:flex; gap:6px;">
      <button id="openDashboardBtn" class="btn">Full Dashboard ↗</button>
    </div>
  </header>

  <div class="kpis">
    <div class="kpi">
      <div id="kpiVisits" class="kpi-val">0</div>
      <div class="kpi-lbl">Site Visits</div>
    </div>
    <div class="kpi">
      <div id="kpiDomains" class="kpi-val">0</div>
      <div class="kpi-lbl">Domains</div>
    </div>
    <div class="kpi">
      <div id="kpiCommands" class="kpi-val">0</div>
      <div class="kpi-lbl">Actions</div>
    </div>
    <div class="kpi">
      <div id="kpiSessions" class="kpi-val">0</div>
      <div class="kpi-lbl">Sessions</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <span>Top Visited Sites</span>
    </div>
    <div id="topDomainsBox" class="chips"></div>
  </div>

  <div class="feed-controls">
    <div class="tabs-toggle">
      <button id="modeSitesBtn" class="tab-btn active">Sites Visited</button>
      <button id="modeAllBtn" class="tab-btn">All Actions</button>
    </div>
    <button id="refreshBtn" class="btn btn-ghost" style="padding:3px 8px; font-size:11px;">Refresh</button>
  </div>

  <div id="feedBox" class="feed"></div>

  <script src="popup.js"></script>
</body>
</html>
